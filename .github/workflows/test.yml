name: Run tests

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        strategy:
            matrix:
                node: [20.x, 22.x, 24.x, latest]
                os: [ubuntu-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            # npm ci builds dist/ through the prepare script
            - run: npm ci
            # Type-checks the sources, tests and scripts, then ESLint
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            # The CommonJS build must load without require(esm)
            - name: Check the CommonJS build
              run: node -e "const m = require('./dist/cjs/index.js'); if (typeof m.detectOtp !== 'function') process.exit(1)"
